name: Check Course Seat

on:
  schedule:
    # Every 5 minutes (GitHub Actions may delay by 1-2 min)
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email?"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check seat availability
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python check_seat.py --test-email
          else
            python check_seat.py
          fi
